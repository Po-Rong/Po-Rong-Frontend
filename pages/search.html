<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORONG</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/search.css" />
  </head>
  <body>
    <header class="common-header">
      <div class="header-container">
        <div class="header-logo">
          <a href="/index.html" class="logo font-point">PORONG</a>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

        <nav class="nav-container">
          <div class="center-menu">
            <a href="/index.html">홈</a>
            <a href="/pages/explore.html">찾기</a>
            <a href="/pages/wishlist.html">찜</a>
            <a href="/pages/mypage.html">마이포롱</a>
          </div>
        </nav>

        <div class="header-right-group">
          <a href="/pages/search.html" class="search-btn" aria-label="검색">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </a>

          <a href="/pages/login.html" class="login-link">로그인</a>

          <label for="menu-toggle" class="hamburger-button">
            <span></span>
            <span></span>
            <span></span>
          </label>
        </div>
      </div>
    </header>

    <main class="search-page-content">
      <section class="search-bar-section">
        <div class="search-input-wrap">
          <span class="search-icon-inside">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#8372DE"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input
            type="text"
            id="popup-search-input"
            placeholder="궁금한 팝업을 검색해 보세요"
            autocomplete="off"
          />
        </div>
      </section>

      <div class="before-search-wrap" id="view-before-search">
        <section class="scroll-section recommend-section">
          <div class="section-header">
            <h2>추천 팝업</h2>
          </div>
          <div
            class="card-scroll-container"
            id="recommend-scroll-container"
          ></div>
        </section>
      </div>

      <div class="after-search-wrap hidden" id="view-after-search">
        <section class="result-info-section">
          <div class="result-badge-title">
            <span class="keyword-highlight" id="result-keyword-text"
              >‘산리오’</span
            >
            에 대한 검색 결과
          </div>
          <div class="result-count-bar">
            운영 / 오픈 예정인 팝업
            <span class="count-num" id="result-count-num">0</span> 건
          </div>
        </section>

        <section class="popup-grid-section">
          <div class="popup-grid-container" id="search-grid-container"></div>
        </section>
      </div>
    </main>

    <script src="/js/index.js"></script>
    <script src="/js/search.js"></script>
  </body>
</html>
