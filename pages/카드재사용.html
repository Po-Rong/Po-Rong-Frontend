<!-- 카드 재사용 복붙 바로 할 수 있게 만들었어요 -->
<!-- 운영 태그도 다 만들어놨으니 각자 복붙해서 api 연결하면 됩니다 -->

<!-- 운영 태그 바꾸는법 -->
<!-- 운영 클래스 명만 바꾸면됩니다
 운영중: card-status is-running
 운영예정: card-status is-upcoming
 운영마감: card-status is-closed 
 -->

<div class="popup-card leisure-card">
  <div class="card-image-wrap">
    <img
      src="/assets/images/dummies/thumb-dummy01.png"
      alt="팝업 썸네일"
      class="card-thumb"
    />
  </div>

  <button class="wish-btn" aria-label="찜하기">
    <span class="heart-icon"></span> 찜하기
  </button>

  <div class="card-body-wrap">
    <div class="card-info">
      <span class="card-status is-running">운영중</span>
      <h3 class="card-title">귀여운 산리오 놀이터 팝업스토어</h3>
      <p class="card-location">강남/서울</p>
      <p class="card-date">26.05.21 - 26.05.24</p>
      <span class="card-category">애니/캐릭터</span>
    </div>
  </div>
</div>

<!-- 리뷰 재사용하는 카드입니다 메인화면에 있는 리뷰 카드입니다 -->
<div class="review-card">
  <div class="review-card-header">
    <span class="reviewer-name">이름</span>
    <span class="review-date">26.05.20</span>
  </div>
  <div class="review-stats-row">
    <div class="rating-wrap">
      <div class="rating-stars" data-score="3.0"></div>
      <span class="rating-num">3.0</span><span>/</span
      ><span class="rating-max">5.0</span>
    </div>

    <div class="congestion-wrap">
      <div class="congestion-icons" data-status="낮음"></div>
      <span class="congestion-text">혼잡도</span>
      <span class="congestion-strong">낮음</span>
    </div>
  </div>
  <div class="review-content">
    <p>사람이 많았지만 캐릭터가 넘 귀여웠어요</p>
  </div>
  <div class="review-attach-box">
    <img
      src="/assets/images/dummies/review-dummy01.png"
      alt="리뷰 첨부 사진"
      class="review-attached-img"
    />
  </div>
  <div class="review-target-popup">
    <div class="target-thumb-wrap">
      <img
        src="/assets/images/dummies/thumb-dummy01.png"
        alt="팝업 미니 썸네일"
        class="target-thumb"
      />
    </div>
    <div class="target-info-wrap">
      <div class="target-tags">
        <span class="card-category">애니/캐릭터</span>
        <span class="card-status is-running">운영중</span>
      </div>
      <h4 class="target-title">산리오 팝업</h4>
      <p class="target-location">홍대</p>
    </div>
  </div>
</div>
