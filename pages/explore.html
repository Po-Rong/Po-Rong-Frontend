<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORONG</title>

    <!-- 모든 페이지 공통 스타일 (폰트, 여백 초기화) -->
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/explore.css" />
  </head>
  <body>
    <header class="common-header">
      <div class="header-container">
        <div class="header-logo">
          <a href="/index.html" class="logo font-point">PORONG</a>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

        <nav class="nav-container">
          <div class="center-menu">
            <a href="/index.html">홈</a>
            <a href="/pages/explore.html">찾기</a>
            <a href="/pages/wishlist.html">찜</a>
            <a href="/pages/mypage.html">마이포롱</a>
          </div>
        </nav>

        <div class="header-right-group">
          <a href="/pages/search.html" class="search-btn" aria-label="검색">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </a>

          <a href="/pages/login.html" class="login-link">로그인</a>

          <label for="menu-toggle" class="hamburger-button">
            <span></span>
            <span></span>
            <span></span>
          </label>
        </div>
      </div>
    </header>

    <main class="explore-content">
      <section class="filter-chip-section">
        <div class="filter-chip-container">
          <button class="filter-chip" id="chip-region" data-type="region">
            지역
          </button>
          <button class="filter-chip" id="chip-category" data-type="category">
            카테고리
          </button>
          <button class="filter-chip" id="chip-status" data-type="status">
            운영 상태
          </button>
        </div>
      </section>

      <section class="sort-bar-section">
        <div class="sort-container">
          <select id="popup-sort-select" class="sort-select">
            <option value="latest">최신등록순</option>
            <option value="rating">별점 높은순</option>
            <option value="closeSoon">종료 임박순</option>
          </select>
        </div>
      </section>

      <section class="popup-grid-section">
        <div class="popup-grid-container" id="explore-grid-container">
          <div class="popup-card leisure-card">
            <div class="card-image-wrap">
              <img
                src="/assets/images/dummies/thumb-dummy01.png"
                alt="팝업 썸네일"
                class="card-thumb"
              />
            </div>
            <button
              class="wish-btn"
              aria-label="찜하기"
              onclick="toggleWish(11, this)"
            >
              <span class="heart-icon"></span> 찜하기
            </button>
            <div class="card-body-wrap">
              <div class="card-info">
                <span
                  class="card-status is-running"
                  style="margin-bottom: 4px; display: inline-block"
                  >운영중</span
                >
                <h3 class="card-title">귀여운 산리오 놀이터 팝업스토어</h3>
                <p class="card-location">강남/서울</p>
                <p class="card-date">26.05.21 - 26.05.24</p>
                <span class="card-category">애니/캐릭터</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="filter-modal-overlay" id="filter-modal">
      <div class="filter-modal-window">
        <div class="modal-header">
          <h3 id="modal-title-text">지역</h3>
          <button class="modal-close-btn" id="modal-close-x">&times;</button>
        </div>

        <div class="modal-body-content" id="modal-chip-grid"></div>

        <div class="modal-footer-actions">
          <button class="btn-action-reset" id="modal-btn-reset">초기화</button>
          <button class="btn-action-apply" id="modal-btn-apply">
            적용하기
          </button>
        </div>
      </div>
    </div>
    <script src="/js/index.js"></script>
    <script src="/js/explore.js"></script>
  </body>
</html>
