<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PORONG</title>

        <!-- 모든 페이지 공통 스타일 (폰트, 여백 초기화) -->
        <link rel="stylesheet" href="/css/global.css" />

        <!-- 이 페이지 전용 CSS가 필요하다면 여기에 추가 (예: main.css 나 board.css) -->
        <!-- <link rel="stylesheet" href="/css/main.css"> -->
    </head>
    <body>
        <!-- [공통 헤더] 모든 파일에 동일하게 복붙해서 사용합니다. -->
        <header class="common-header">
            <div class="header-container">
                <div class="header-logo">
                    <a href="/index.html" class="logo font-point">PORONG</a>
                </div>

                <input type="checkbox" id="menu-toggle" class="menu-checkbox" />

                <nav class="nav-container">
                    <div class="center-menu">
                        <a href="/index.html">홈</a>
                        <a href="/pages/explore.html">찾기</a>
                        <a href="/pages/wishlist.html">찜</a>
                        <a href="/pages/mypage.html">마이포롱</a>
                    </div>
                </nav>

                <div class="header-right-group">
                    <a
                        href="/pages/search.html"
                        class="search-btn"
                        aria-label="검색"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </a>

                    <a href="/pages/login.html" class="login-link">로그인</a>

                    <label for="menu-toggle" class="hamburger-button">
                        <span></span>
                        <span></span>
                        <span></span>
                    </label>
                </div>
            </div>
        </header>

        <!-- [본문 영역] 각자 페이지에 맞는 내용을 여기 안에 작성하세요 -->
        <main>
            <div class="popup-container">
                <div class="popup-box">
                    <h2>팝업스토어 수정</h2>
                    <div id="popupRegisterMsg" class="msg"></div>

                    <div class="form-group">
                        <label>이름</label>
                        <input
                            type="text"
                            id="popupTitle"
                            placeholder="팝업 스토어 이름을 입력해주세요"
                        />
                    </div>

                    <div class="form-group">
                        <label>대표 사진</label>
                        <input
                            type="file"
                            id="mainImage"
                            accept="image/*"
                            style="display: none"
                            onchange="handleMainImage(this)"
                        />
                        <button
                            type="button"
                            onclick="
                                document.getElementById('mainImage').click()
                            "
                        >
                            눌러서 대표 이미지 올리기 (<span id="mainImageCount"
                                >0</span
                            >/1)
                        </button>
                        <div id="mainImagePreview"></div>
                    </div>

                    <div class="form-group">
                        <label>일정</label>
                        <div class="date-group">
                            <input
                                type="datetime-local"
                                id="startDate"
                                placeholder="시작일"
                            />
                            <input
                                type="datetime-local"
                                id="endDate"
                                placeholder="종료일"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>예약</label>
                        <div class="date-group">
                            <input
                                type="datetime-local"
                                id="reservationStartDate"
                                placeholder="시작일"
                            />
                            <input
                                type="datetime-local"
                                id="reservationEndDate"
                                placeholder="종료일"
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>카테고리</label>
                        <div
                            id="categoryList"
                            class="category-group admin-category"
                        >
                            <!-- API에서 가져와서 동적으로 생성 -->
                        </div>
                        <input type="hidden" id="selectedCategory" />
                    </div>

                    <div class="form-group">
                        <label>지역</label>
                        <div id="regionList" class="region-group admin-region">
                            <!-- API에서 가져와서 동적으로 생성 -->
                        </div>
                        <input type="hidden" id="selectedRegion" />
                    </div>

                    <div class="form-group">
                        <label>주소</label>
                        <input
                            type="text"
                            id="popupAddress"
                            placeholder="주소를 입력해주세요 | 예) 서울시 성동구 성수일로 89"
                        />
                    </div>

                    <div class="form-group">
                        <label>혜택</label>
                        <input
                            type="text"
                            id="popupBenefit"
                            placeholder="혜택을 입력해주세요"
                        />
                    </div>

                    <div class="form-group">
                        <label>공지사항</label>
                        <input
                            type="text"
                            id="popupNotice"
                            placeholder="공지사항을 입력해주세요"
                        />
                    </div>

                    <div class="form-group">
                        <label>정보</label>
                        <input
                            type="text"
                            id="popupInfo"
                            placeholder="정보를 입력해주세요"
                        />
                    </div>

                    <div class="form-group">
                        <label>상세이미지 등록(선택)</label>
                        <input
                            type="file"
                            id="detailImages"
                            accept="image/*"
                            multiple
                            style="display: none"
                            onchange="handleDetailImages(this)"
                        />
                        <button
                            type="button"
                            onclick="
                                document.getElementById('detailImages').click()
                            "
                        >
                            눌러서 상세 이미지 올리기 (<span
                                id="detailImageCount"
                                >0</span
                            >/3)
                        </button>
                        <div id="detailImagePreview"></div>
                    </div>

                    <div class="form-group">
                        <label>SNS</label>
                        <input
                            type="text"
                            id="popupSNS"
                            placeholder="SNS 링크를 입력해주세요"
                        />
                    </div>

                    <div class="form-group">
                        <label>태그</label>
                        <div class="tag-input-group">
                            <input
                                type="text"
                                id="popupTag"
                                placeholder="태그를 입력하고 추가 버튼을 눌러주세요"
                                onkeydown="if (event.key === 'Enter') addTag();"
                            />
                            <button type="button" onclick="addTag()">
                                추가
                            </button>
                        </div>
                        <div id="tagList"></div>
                        <!-- 추가된 태그 표시 -->
                    </div>

                    <button class="btn-submit" onclick="editPopup()">
                        수정하기
                    </button>
                </div>
            </div>
        </main>

        <!-- 이 페이지 전용 JS가 필요하다면 여기에 추가 -->
        <!-- <script src="/js/main.js"></script> -->
        <script src="/js/index.js"></script>
        <script src="/js/admin-popup.js"></script>
    </body>
</html>
