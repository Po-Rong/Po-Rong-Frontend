<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORONG</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/review.css" />
</head>

<body>
    <header class="common-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="/index.html" class="logo font-point">PORONG</a>
            </div>
            <nav class="nav-container">
                <div class="center-menu">
                    <a href="/index.html">홈</a>
                    <a href="/pages/explore.html">찾기</a>
                    <a href="/pages/wishlist.html">찜</a>
                    <a href="/pages/mypage.html">마이포롱</a>
                </div>
            </nav>
            <div class="header-right-group">
                <a href="/pages/login.html" class="login-link">로그인</a>
            </div>
        </div>
    </header>

    <main class="review-write-wrapper">
        <h1 class="page-main-title">포롱 후기</h1>
        <div class="review-write-container">
            <section class="review-rating-card">
                <div class="rating-content-box">
                    <div class="rating-score-display">
                        <span class="current-score" id="avgScoreDisplay">0.0</span>
                        <span class="max-score"> / 5.0</span>
                    </div>
                    <div class="stars-display-group" id="avgStarsGroup"></div>

                    <div class="congestion-stats-group">
                        <p class="congestion-title">혼잡도 <span class="status-text-blue" id="mainCongestionText">-</span>
                        </p>
                        <div class="congestion-icons-row" id="mainCongestionIcons">
                            <img src="/assets/images/icons/icon-person-empty.png" class="btn-congestion"
                                data-level="LOW" alt="낮음" />
                            <img src="/assets/images/icons/icon-person-empty.png" class="btn-congestion"
                                data-level="NORMAL" alt="보통" />
                            <img src="/assets/images/icons/icon-person-empty.png" class="btn-congestion"
                                data-level="HIGH" alt="높음" />
                        </div>
                    </div>

                    <div class="visit-prompt-box">
                        <p class="prompt-text">이 팝업 방문하셨나요?</p>
                        <p class="sub-prompt-text">방문 예정인 분들에게 도움이 되는 후기를 작성해주세요</p>
                        <div class="prompt-stars" id="interactivePromptStars">
                            <img src="/assets/images/icons/icon-star-empty.png" class="prompt-star-btn" data-value="1"
                                alt="1점" />
                            <img src="/assets/images/icons/icon-star-empty.png" class="prompt-star-btn" data-value="2"
                                alt="2점" />
                            <img src="/assets/images/icons/icon-star-empty.png" class="prompt-star-btn" data-value="3"
                                alt="3점" />
                            <img src="/assets/images/icons/icon-star-empty.png" class="prompt-star-btn" data-value="4"
                                alt="4점" />
                            <img src="/assets/images/icons/icon-star-empty.png" class="prompt-star-btn" data-value="5"
                                alt="5점" />
                        </div>
                    </div>
                </div>
            </section>

            <div class="reviews-list-group"></div>
        </div>
    </main>

    <div class="image-modal-overlay" id="imageModal">
        <div class="image-modal-content" id="modalContent">
            <button type="button" class="btn-modal-close" id="modalClose">&times;</button>
        </div>
    </div>
    <script src="/js/index.js"></script>
    <script src="/js/reviews.js"></script>
</body>

</html>
