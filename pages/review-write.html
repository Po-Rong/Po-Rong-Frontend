<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORONG</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/review.css" />
</head>

<body>
    <header class="common-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="/index.html" class="logo font-point">PORONG</a>
            </div>
            <nav class="nav-container">
                <div class="center-menu">
                    <a href="/index.html">홈</a>
                    <a href="/pages/explore.html">찾기</a>
                    <a href="/pages/wishlist.html">찜</a>
                    <a href="/pages/mypage.html">마이포롱</a>
                </div>
            </nav>
            <div class="header-right-group">
                <a href="/pages/login.html" class="login-link">로그인</a>
            </div>
        </div>
    </header>

    <main class="review-write-wrapper">
        <h1 class="page-main-title">후기 쓰기</h1>
        <div class="review-write-container">


            <section class="review-popup-summary">
                <div class="summary-thumb-box">
                    <img src="/images/image29.png" alt="팝업 썸네일" id="popup-thumb" />
                </div>
                <div class="summary-info-box">
                    <div class="tag-row">
                        <span class="badge-category">애니 / 캐릭터</span>
                        <span class="badge-status">운영중</span>
                    </div>
                    <h2 class="popup-title-text">산리오 팝업 - AK 몰</h2>
                    <p class="popup-region-text">홍대</p>
                </div>
            </section>

            <div class="review-rating-card">
                <div class="rating-content-box"></div>
                <div class="rating-score-display">
                    <span class="current-score" id="score-text">0.0</span>
                    <span class="max-score"> / 5.0</span>
                </div>
                <div class="stars-select-group" id="stars-container">
                    <span class="star-btn" data-value="1">★</span>
                    <span class="star-btn" data-value="2">★</span>
                    <span class="star-btn" data-value="3">★</span>
                    <span class="star-btn" data-value="4">★</span>
                    <span class="star-btn" data-value="5">★</span>
                </div>


                <div class="congestion-select-group">
                    <p class="congestion-title">혼잡도 <span class="selected-status-text" id="congestion-text">보통</span>
                    </p>
                    <div class="congestion-icons-row">
                        <button type="button" class="btn-congestion" data-status="smooth" aria-label="여유">
                            <svg class="icon-person" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z" />
                            </svg>
                        </button>
                        <button type="button" class="btn-congestion active" data-status="normal" aria-label="보통">
                            <svg class="icon-person" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z" />
                            </svg>
                        </button>
                        <button type="button" class="btn-congestion" data-status="crowded" aria-label="혼잡">
                            <svg class="icon-person" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            </section>

            <section class="review-content-form">
                <div class="textarea-wrapper">
                    <textarea id="review-textarea" placeholder="팝업 스토어에 대한 후기를 남겨주세요!"></textarea>
                </div>

                <div class="file-upload-wrapper">
                    <input type="file" id="review-file-input" accept="image/*" style="display: none;" />
                    <button type="button" class="btn-file-trigger" id="btn-file-dummy">눌러서 사진 올리기 (0/1)</button>
                </div>

                <div class="submit-action-row">
                    <button type="button" id="btn-submit-review" class="btn-main-submit">후기 등록하기</button>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/review-write.js"></script>
</body>

</html>
