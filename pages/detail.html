<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PORONG</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/detail.css">
</head>

<body>
    <header class="common-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="/index.html" class="logo font-point">PORONG</a>
            </div>
            <input type="checkbox" id="menu-toggle" class="menu-checkbox" />
            <nav class="nav-container">
                <div class="center-menu">
                    <a href="/index.html">홈</a>
                    <a href="/pages/explore.html">찾기</a>
                    <a href="/pages/wishlist.html">찜</a>
                    <a href="/pages/mypage.html">마이포롱</a>
                </div>
            </nav>
            <div class="header-right-group">
                <a href="/pages/search.html" class="search-btn" aria-label="검색">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </a>
                <a href="/pages/login.html" class="login-link">로그인</a>
                <label for="menu-toggle" class="hamburger-button">
                    <span></span><span></span><span></span>
                </label>
            </div>
        </div>
    </header>

    <main class="detail-wrapper">
        <section class="section-main-poster">
            <div class="poster-container">
                <img src="" alt="팝업스토어 메인 포스터" id="popup-main-thumb" />
            </div>
        </section>

        <div class="detail-container">
            <section class="section-info-summary">
                <div class="status-tag-row">
                    <span class="badge-status" id="popup-status"></span>
                    <span class="badge-category" id="popup-category"></span>
                </div>

                <h1 class="popup-title" id="popup-title"></h1>

                <div class="rating-row">
                    <span class="stars" id="popup-stars"></span>
                    <span class="rating-score" id="popup-rating-score"></span>
                    <a href="#reviews" class="review-count-link" id="popup-review-count"></a>
                </div>

                <hr class="detail-divider" />

                <ul class="meta-info-list">
                    <li class="meta-row-layout">
                        <span class="meta-label">일정</span>
                        <div class="meta-value-group">
                            <span class="meta-value" id="popup-period"></span>
                            <div class="time-sub-group" id="popup-hours">
                            </div>
                        </div>
                    </li>
                    <hr class="detail-divider" />
                    <li class="meta-row-layout">
                        <span class="meta-label">위치</span>
                        <div class="meta-value-group">
                            <span class="meta-value" id="popup-location"></span>
                        </div>
                    </li>
                </ul>
            </section>
            <hr class="detail-divider" />

            <section class="section-card-block">
                <h3 class="block-title">혜택</h3>
                <div class="card-inner-panel font-pre-wrap" id="popup-benefit">
                </div>
            </section>
            <hr class="detail-divider" />

            <section class="section-card-block">
                <h3 class="block-title">공지사항</h3>
                <div class="card-inner-panel font-pre-wrap" id="popup-notice">
                </div>
            </section>
            <hr class="detail-divider" />

            <section class="section-card-block">
                <h3 class="block-title">정보</h3>
                <div class="font-pre-wrap" id="popup-intro">
                </div>
            </section>
            <hr class="detail-divider" />

            <section class="section-detail-content">
                <h3 class="detail-sub-title">상세 이미지</h3>
                <div class="long-image-wrapper"></div>
            </section>
        </div>
        <div class="fixed-bottom-bar">
            <div class="bottom-bar-container">

                <div class="bar-notice">
                    찜하고 <span class="highlight">업데이트 되는 팝업 소식</span>을 받아보세요!
                </div>

                <div class="bar-action-group">
                    <button type="button" class="wish-toggle-btn" aria-label="찜하기">
                        <svg class="heart-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                            </path>
                        </svg>
                        <span class="wish-count">201</span>
                    </button>

                    <a href="/pages/reservation.html" class="reservation-btn">예약하러 가기</a>
                </div>

            </div>
        </div>
    </main>
    <script src="/js/index.js"></script>

    <script src="/js/detail.js"></script>
</body>

</html>
